name: Build(a54x_release)

on:
  workflow_dispatch:
    inputs:
      do_release:
        description: 'Release？'
        required: true
        type: boolean
      firmware_url_1:
        description: 'target fw'
        required: true
        type: string
      firmware_url_2:
        description: 'source fw'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Download old firmwares
        run: |
          set -e

          # 第一組
          MODEL1="SM-A5460"
          REGION1="BRI"
          mkdir -p out/odin/${MODEL1}_${REGION1}
          curl -L -o out/firmware-a5460.zip "${{ github.event.inputs.firmware_url_1 }}"

          if [ -s out/firmware-a5460.zip ]; then
            unzip -q out/firmware-a5460.zip -d out/odin/${MODEL1}_${REGION1}
            rm out/firmware-a5460.zip
          else
            echo "Firmware #1 下載失敗或為空檔案" >&2
            exit 1
          fi

          latest_ver_1=$(curl -s --retry 5 --retry-delay 5 "https://fota-cloud-dn.ospserver.net/firmware/$REGION1/$MODEL1/version.xml" \
            | grep latest | sed 's/^[^>]*>//' | sed 's/<.*//')
          echo "$latest_ver_1" > out/odin/${MODEL1}_${REGION1}/.downloaded

          # 第二組
          MODEL2="SM-S938B"
          REGION2="EUX"
          mkdir -p out/odin/${MODEL2}_${REGION2}
          curl -L -o out/firmware-s938b.zip "${{ github.event.inputs.firmware_url_2 }}"

          if [ -s out/firmware-s938b.zip ]; then
            unzip -q out/firmware-s938b.zip -d out/odin/${MODEL2}_${REGION2}
            rm out/firmware-s938b.zip
          else
            echo "Firmware #2 下載失敗或為空檔案" >&2
            exit 1
          fi

          latest_ver_2=$(curl -s --retry 5 --retry-delay 5 "https://fota-cloud-dn.ospserver.net/firmware/$REGION2/$MODEL2/version.xml" \
            | grep latest | sed 's/^[^>]*>//' | sed 's/<.*//')
          echo "$latest_ver_2" > out/odin/${MODEL2}_${REGION2}/.downloaded

      - name: Set up build environment
        run: |
          sudo apt update
          sudo apt update && sudo apt upgrade && sudo apt install -y attr ccache clang git golang libbrotli-dev libgtest-dev liblz4-dev libpcre2-dev libprotobuf-dev libunwind-dev libusb-1.0-0-dev libzstd-dev lld openjdk-11-jdk protobuf-compiler zip zipalign make cmake npm lz4 brotli patchelf curl xxd
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            attr ccache clang ffmpeg golang \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'

      - name: Build dependencies
        run: wget https://github.com/mattchengg/UN1CA/releases/download/20250418-010410/tools.tar.gz 2>/dev/null && mkdir -p out/tools && tar -xzvf tools.tar.gz -C out/tools

      - name: Download stock firmwares
        run: |
          source ./buildenv.sh a54x
          ./scripts/download_fw.sh

      - name: Extract stock firmwares
        run: |
          source ./buildenv.sh a54x
          ./scripts/extract_fw.sh

      - name: Build ROM
        run: |
          source ./buildenv.sh a54x
          ./scripts/make_rom.sh 

      - name: Load ROM version
        id: load_version
        run: |
          source ./buildenv.sh a54x
          VERSION=${ROM_VERSION%%-*}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Upload file to Gofile
        if: ${{ github.event.inputs.do_release }}
        run: |
          FILE_PATH=$(ls out/Ex*.zip | head -n1)

          UPLOAD_RESPONSE=$(curl -s -X POST "https://upload.gofile.io/uploadfile" \
            -H "Authorization: ${{ secrets.GOFILE_TOKEN }}" \
            -F "file=@${FILE_PATH}")

          DOWNLOAD_PAGE=$(echo $UPLOAD_RESPONSE | jq -r '.data.downloadPage')
          echo "GF_LINK=$DOWNLOAD_PAGE" >> $GITHUB_ENV

      - name: Create GitHub Release (with SourceForge link)
        if: ${{ github.event.inputs.do_release }}
        uses: softprops/action-gh-release@v2
        with:
          name: A54 unofficial release
          tag_name: "${{ env.VERSION }}"
          body: |
            📱 **For Galaxy A54 (Unofficial)**
            
            ⚠️ If you're using A5460, use this recovery：
            https://github.com/mattchengg/android_device_samsung_a54x/releases/
            
            📦 **Download：**
            [GoFile](${{ env.GF_LINK }})
            ⚙️ *Build by GitHub Actions*
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
