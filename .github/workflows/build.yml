name: Build(a54x_release)

on:
  workflow_dispatch:
    inputs:
      do_release:
        description: 'Release？'
        required: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Download old firmware for A54
        run: |
          set -e
          MODEL="SM-A5460"
          REGION="BRI"
          mkdir -p out/odin/${MODEL}_${REGION}
          curl -L -o out/firmware.zip "https://27-samfw."

          if [ -f out/firmware.zip ]; then
            unzip out/firmware.zip -d out/odin/${MODEL}_${REGION}
          else
            echo "韌體下載失敗" >&2
            exit 1
          fi

          # 取得最新版本資訊並寫入 .downloaded
          latest_ver=$(curl -s --retry 5 --retry-delay 5 "https://fota-cloud-dn.ospserver.net/firmware/$REGION/$MODEL/version.xml" \
            | grep latest | sed 's/^[^>]*>//' | sed 's/<.*//')

          echo "$latest_ver" > out/odin/${MODEL}_${REGION}/.downloaded
      
      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            attr ccache clang ffmpeg golang \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'

      - name: Build dependencies
        run: wget https://github.com/mattchengg/UN1CA/releases/download/20250418-010410/tools.tar.gz 2>/dev/null && mkdir -p out/tools && tar -xzvf tools.tar.gz -C out/tools

      - name: Download stock firmwares
        run: |
          source ./buildenv.sh a54x
          ./scripts/download_fw.sh

      - name: Extract stock firmwares
        run: |
          source ./buildenv.sh a54x
          ./scripts/extract_fw.sh

      - name: Build ROM
        run: |
          source ./buildenv.sh a54x
          ./scripts/make_rom.sh 

      - name: Load ROM version
        id: load_version
        run: |
          source ./buildenv.sh a54x
          VERSION=${ROM_VERSION%%-*}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      
      - name: Upload file to Gofile
        if: ${{ github.event.inputs.do_release }}
        run: |
          FILE_PATH=$(ls out/UN1CA*.zip | head -n1)

          UPLOAD_RESPONSE=$(curl -s -X POST "https://upload.gofile.io/uploadfile" \
            -H "Authorization: ${{ secrets.GOFILE_TOKEN }}" \
            -F "file=@${FILE_PATH}")

          DOWNLOAD_PAGE=$(echo $UPLOAD_RESPONSE | jq -r '.data.downloadPage')
          echo "GF_LINK=$DOWNLOAD_PAGE" >> $GITHUB_ENV
        

      - name: Create GitHub Release (with SourceForge link)
        if: ${{ github.event.inputs.do_release }}
        uses: softprops/action-gh-release@v2
        with:
          name: UN1CA A54 unofficial release
          tag_name: "${{ env.VERSION }}"
          body: |
            📱 **UN1CA for Galaxy A54 (Unofficial)**
            
            ⚠️ If you're using A5460, use this recovery：
            https://github.com/mattchengg/android_device_samsung_a54x/releases/
            
            📦 **Download：**
            [SourceForge](${{ env.SF_LINK }})
            [GoFile](${{ env.GF_LINK }})
            ⚙️ *Build by GitHub Actions*
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
          
